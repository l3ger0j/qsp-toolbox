[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aero2qspider"
dynamic = ["version"]
description = "Semi-automatic conversion of AeroQSP games for the qSpider player"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["qsp", "aeroqsp", "qspider", "interactive-fiction", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.scripts]
aero2qspider = "aero2qspider.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aero2qspider.__version__" }

[tool.setuptools.package-data]
aero2qspider = ["drivers/*", "data/*"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003", "E501"]
